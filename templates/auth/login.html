{% extends "base.html" %}
{% block title %}Sign in — CFRS{% endblock %}
{% block content %}
<section class="section wrap" style="max-width:440px">
  <h2>Welcome back</h2>
  <p class="muted mt-1">Sign in to reach your dashboard.</p>
  <form method="post" class="card card-p mt-3">
    {% csrf_token %}
    <div class="field"><label>Email</label>
      <input type="email" name="email" required autofocus placeholder="you@example.com"></div>
    <div class="field"><label>Password</label>
      <input type="password" name="password" required placeholder="Your password"></div>
    <button class="btn btn-green" style="width:100%">Sign in</button>
  </form>
  <p class="muted mt-2 center">New here? <a href="/register/">Create an account</a></p>
</section>
{% endblock %}
